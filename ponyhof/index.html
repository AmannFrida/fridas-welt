<script>
(function(){
  var SALT="cG9ueWhvZi1ncmV0YS0yNg==", ITER=150000, SK="ph-schluessel", DB="ph-auth";
  function b64(u8){ var s=""; for(var i=0;i<u8.length;i+=8192) s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(s); }
  function unb64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  var data=unb64(document.getElementById("enc").textContent.trim());
  var lade=document.getElementById("lade"), f=document.getElementById("f"), pw=document.getElementById("pw"), go=document.getElementById("go"), err=document.getElementById("err");

  // Schlüssel auf dem Gerät merken (mehrfach, falls ein Speicher gelöscht wird)
  function idb(){ return new Promise(function(res){ try{ var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
  function merken(raw){
    try{ localStorage.setItem(SK,raw); }catch(e){}
    try{ document.cookie=SK+"="+raw+"; max-age=34560000; path=/; SameSite=Lax"+(location.protocol==="https:"?"; Secure":""); }catch(e){}
    idb().then(function(d){ if(!d) return; try{ d.transaction("kv","readwrite").objectStore("kv").put(raw,SK); }catch(e){} });
  }
  function vergessen(){
    try{ localStorage.removeItem(SK); }catch(e){}
    try{ document.cookie=SK+"=; max-age=0; path=/"; }catch(e){}
    idb().then(function(d){ if(!d) return; try{ d.transaction("kv","readwrite").objectStore("kv").delete(SK); }catch(e){} });
  }
  function gemerkt(){
    var v=null; try{ v=localStorage.getItem(SK); }catch(e){}
    if(!v){ var m=document.cookie.match(new RegExp("(?:^|; )"+SK+"=([^;]+)")); if(m) v=m[1]; }
    if(v) return Promise.resolve(v);
    return idb().then(function(d){ if(!d) return null; return new Promise(function(res){ try{ var r=d.transaction("kv").objectStore("kv").get(SK); r.onsuccess=function(){ res(r.result||null); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); });
  }
  function oeffnen(raw){
    return crypto.subtle.importKey("raw",unb64(raw),"AES-GCM",false,["decrypt"]).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM",iv:data.subarray(0,12)},key,data.subarray(12)).then(function(pl){
        var html=new TextDecoder().decode(pl);
        window.__FWKEY=key; window.__FWKEYRAW=raw;
        // Seite austauschen (ohne document.write – funktioniert auch in Safari/iPhone)
        var neu=new DOMParser().parseFromString(html,"text/html");
        document.title=neu.title||document.title;
        var root=document.importNode(neu.documentElement,true);
        document.replaceChild(root,document.documentElement);
        var S=[].slice.call(document.querySelectorAll("script"));
        S.forEach(function(alt){
          var t=(alt.getAttribute("type")||"").toLowerCase();
          if(t && t!=="text/javascript" && t!=="module") return;
          var n=document.createElement("script");
          for(var i=0;i<alt.attributes.length;i++) n.setAttribute(alt.attributes[i].name,alt.attributes[i].value);

        });
      });
    });
  }
  function ausPasswort(p){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]).then(function(k){

  }
